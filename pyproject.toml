[project]
name = "tree-surgery"
version = "0.1.0"
description = "Can an LLM in the optimization loop beat standard optimization when editing a trained LightGBM model's leaf values?"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
llm = [
    "openai>=1.40",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tree_surgery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: test needs to download a dataset (California Housing)",
]
