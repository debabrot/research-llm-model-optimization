# Tree Surgery experiment configuration. Mirrors PLAN.md §2, §3, §6.
# Changes after experiments start must be logged in PLAN.md's changelog.

seeds: [0, 1, 2, 3, 4]

splits:            # PLAN §2: random 50 / 15 / 15 / 20
  train: 0.50
  cal: 0.15
  val: 0.15
  test: 0.20

datasets:
  delivery:        # D1, semi-synthetic
    n_rows: 20000
  california:      # D2, sklearn California Housing
    n_rows: 20640

base_model:        # PLAN §3
  params:
    objective: regression
    metric: rmse
    num_leaves: 15
    learning_rate: 0.05
    # determinism: same (data, seed) -> bit-identical model
    deterministic: true
    force_row_wise: true
    num_threads: 1
    verbose: -1
  num_boost_round: 5000   # raised from 1000 on 2026-11-23 (PLAN changelog)
  early_stopping_rounds: 50

edit_budget:       # PLAN §4, §6 (used from Phase 2). Applies to EVERY edit arm, LLM or not.
  max_leaves: 10
  max_candidates: 10   # was 20; cut for the ₹200 budget (PLAN changelog 2026-11-18)

ridge_lambdas: [0.001, 0.01, 0.1, 1, 10, 100]   # on (1/n)||r - X_S d||^2 + lambda ||d||^2, chosen on val

arms:              # PLAN §4 (Phase 2). Candidate = leaf subset; values by ridge on cal, lambda on val.
  random_opt:
    min_n_cal: 1         # draw only leaves that hold calibration rows (others can't be fitted)
  sparse_opt:
    method: omp          # omp: supports of size 1..10 along one OMP path | lasso: Lasso-path supports
  refit:                 # Booster.refit on cal; decay chosen on val. Ceiling, no edit budget.
    decay_rates: [0.0, 0.25, 0.5, 0.75, 0.9, 0.95, 0.99]
llm_direct_delta_bound_std: 0.5   # |delta| <= 0.5 * std(y_train)
llm_runs_per_cell: 3

# ---------------------------------------------------------------------------
# LLM settings (Phase 3+). Default mode is replay: no keys, no spend.
# Keys come from .env (see .env.example), never from this file.
# ---------------------------------------------------------------------------
llm:
  provider: openrouter                    # OpenAI-compatible endpoint
  base_url: https://openrouter.ai/api/v1
  models:
    cheap: deepseek/deepseek-v4.1-flash   # Option A: the only model in the current budget
    strong: anthropic/claude-opus-5.5     # needs a separate budget; not run under Option A
  reasoning_effort: low                   # fixed per model and recorded with results
  temperature: 1.0                        # provider default; fixed and recorded (3 runs = 3 samples)
  max_tokens_per_call: 4000               # no single call can run away

  prices:                                 # USD per 1M tokens, for the budget guard and projections.
    # OpenRouter reports the real charge per call (usage.cost); that is what gets logged.
    deepseek/deepseek-v4.1-flash: {input: 0.10, output: 0.60, cache_read: 0.03}   # conservative
    anthropic/claude-opus-5.5:    {input: 4.00, output: 20.00, cache_read: 0.20}

  session:                                # one query-tool loop (PLAN §5, changelog)
    max_queries: 3                        # query_leaves calls per session
    rows_per_query: 30
    candidates_per_session: 5             # 10 candidates per run = 2 feedback rounds

  budget:
    max_spend_inr: 200                    # hard stop in the client, before the call that would cross it
    inr_per_usd: 95                       # OpenRouter bills in USD; ₹200 ≈ $2.10
